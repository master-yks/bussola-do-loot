name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Garantir Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
          }

      - name: Executar testes, gerar instalador e pacote portátil
        shell: pwsh
        run: .\scripts\Publicar-Windows.ps1

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Bússola do Loot ${{ inputs.tag || github.ref_name }} para Windows x64"
          generate_release_notes: true
          files: |
            artifacts/release/BussolaDoLoot-Setup-win-x64.exe
            artifacts/release/BussolaDoLoot-Portable-win-x64.zip
            artifacts/release/SHA256SUMS.txt
